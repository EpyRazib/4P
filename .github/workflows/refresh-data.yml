name: Refresh EWO data

# Downloads the workbook from the OneDrive sharing link, rebuilds data.json,
# and commits it when the numbers have actually changed. GitHub Pages then
# serves the fresh file to everyone with no action from anybody.
#
# Before this runs, add ONE repository secret:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name:   ONEDRIVE_FOLDER_URL
#   Value:  the "Anyone with the link" address of the OneDrive FOLDER that holds
#           both workbooks. The script finds them by name: one matching
#           "EWO ... Life ... Cycle", one matching "Fabric ... Delivery".
#
# The older per-file secrets still work as a fallback when the folder secret
# is absent: ONEDRIVE_SHARE_URL (EWO workbook) and ONEDRIVE_SHARE_URL_2
# (Fabric Delivery workbook).
#
# Keeping it in a secret rather than in the workflow file means the link does
# not sit in public source, so nobody can grab the whole workbook from it.

on:
  schedule:
    # Every 15 minutes. GitHub queues scheduled jobs, so a few minutes of
    # drift is normal and busy periods can delay a run further.
    - cron: "*/15 * * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    paths:
      - "export_ewo_data.py"
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: write           # needed to commit data.json back to the branch

concurrency:
  group: refresh-ewo-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install openpyxl
        run: python -m pip install --quiet --upgrade openpyxl

      - name: Confirm a sharing link secret exists
        env:
          FOLDER_URL: ${{ secrets.ONEDRIVE_FOLDER_URL }}
          SHARE_URL: ${{ secrets.ONEDRIVE_SHARE_URL }}
        run: |
          if [ -z "$FOLDER_URL" ] && [ -z "$SHARE_URL" ]; then
            echo "::error::Neither ONEDRIVE_FOLDER_URL nor ONEDRIVE_SHARE_URL is set."
            echo "Add ONEDRIVE_FOLDER_URL under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build data.json from the workbooks
        env:
          FOLDER_URL: ${{ secrets.ONEDRIVE_FOLDER_URL }}
          SHARE_URL: ${{ secrets.ONEDRIVE_SHARE_URL }}
          DELIVERY_URL: ${{ secrets.ONEDRIVE_SHARE_URL_2 }}
        run: |
          if [ -n "$FOLDER_URL" ]; then
            python export_ewo_data.py --folder "$FOLDER_URL" -o data.json
          elif [ -n "$DELIVERY_URL" ]; then
            python export_ewo_data.py "$SHARE_URL" --delivery "$DELIVERY_URL" -o data.json
          else
            echo "::warning::No delivery workbook link, so the fabric delivery tab will be empty."
            python export_ewo_data.py "$SHARE_URL" -o data.json
          fi

      - name: Show what was produced
        run: ls -l data.json

      - name: Commit data.json when it has changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage first. On the very first run data.json is a new file, and a
          # plain "git diff" does not report new files at all, so checking
          # before staging would skip the commit forever.
          git add data.json

          if git diff --cached --quiet; then
            echo "Data is unchanged, nothing to commit."
            exit 0
          fi

          git commit -m "Refresh EWO data $(date -u '+%Y-%m-%d %H:%M UTC')"

          # Another commit may have landed while this ran.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"

          echo "Committed and pushed data.json"
