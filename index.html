<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EWO Life Cycle Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --paper:#FAFAF8;
    --ink:#1C1F22;
    --ink-soft:#6B7280;
    --line:#E3E1D9;
    --teal:#2B6E5E;
    --teal-dim:#E7EFEC;
    --rust:#C7511F;
    --rust-dim:#F7E9E2;
    --amber:#B98900;
    --amber-dim:#FCF3D9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
    font-size:14px;
    line-height:1.5;
  }
  h1,h2,h3{
    font-family:Georgia,"Source Serif 4",serif;
    font-weight:600;
    margin:0;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 28px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
    gap:12px;
  }
  .topbar h1{font-size:20px;letter-spacing:-0.01em;}
  .topbar .sub{color:var(--ink-soft);font-size:12px;margin-top:2px;}
  .status{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--ink-soft);
    flex-wrap:wrap;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-soft);flex:none;}
  .dot.live{background:var(--teal);}
  .dot.err{background:var(--rust);}
  .dot.busy{background:var(--amber);}
  button{
    font-family:inherit;
    font-size:13px;
    padding:9px 16px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
    border-radius:2px;
  }
  button:disabled{opacity:0.4;cursor:default;}
  main{max-width:1180px;margin:0 auto;padding:28px 28px 80px;}
  .panel{
    border:1px solid var(--line);
    padding:22px;
    margin-bottom:20px;
    background:#fff;
  }
  .panel h3{font-size:16px;margin-bottom:16px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media(max-width:800px){.two-col{grid-template-columns:1fr;}}
  .grid-stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    margin-bottom:20px;
  }
  .stat{background:#fff;padding:18px 20px;}
  .stat .label{color:var(--ink-soft);font-size:11px;margin-bottom:6px;}
  .stat .value{font-family:Georgia,serif;font-size:26px;color:var(--teal);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{color:var(--ink-soft);font-weight:normal;border-bottom:1px solid var(--ink);position:sticky;top:0;background:#fff;}
  tr:hover td{background:var(--teal-dim);}
  .table-wrap{overflow-x:auto;max-height:440px;overflow-y:auto;border:1px solid var(--line);}
  .chart-box{position:relative;height:280px;}
  .error{background:var(--rust-dim);color:var(--rust);border:1px solid var(--rust);padding:16px 18px;margin-bottom:20px;font-size:13px;}
  .error code{background:#fff;padding:1px 5px;border:1px solid var(--rust);}
  .filter-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  input[type="text"]{
    font-family:inherit;font-size:13px;padding:8px 10px;
    border:1px solid var(--line);background:var(--paper);color:var(--ink);flex:1;min-width:180px;
  }
  select{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);}
  .badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;}
  .badge.locked{background:var(--teal-dim);color:var(--teal);}
  .badge.hold{background:var(--rust-dim);color:var(--rust);}
  .badge.tbc{background:var(--amber-dim);color:var(--amber);}
  .badge.cancel{background:#EDEDED;color:var(--ink-soft);}
  .loading{text-align:center;padding:110px 20px;color:var(--ink-soft);}
  .loading h2{color:var(--ink);font-size:20px;margin-bottom:8px;}
  .spinner{
    width:22px;height:22px;margin:0 auto 22px;
    border:2px solid var(--line);border-top-color:var(--teal);border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>EWO Life Cycle Dashboard</h1>
    <div class="sub" id="fileLabel">Connecting to OneDrive</div>
  </div>
  <div class="status">
    <span class="dot busy" id="statusDot"></span>
    <span id="statusText">Loading</span>
    <button id="refreshBtn" disabled>Refresh</button>
  </div>
</div>

<main>
  <div id="errorBox"></div>

  <div id="loadingState" class="loading">
    <div class="spinner"></div>
    <h2>Loading the latest data</h2>
    <p>Reading the EWO workbook from OneDrive.</p>
  </div>

  <div id="dashboard" style="display:none;">
    <div class="grid-stats" id="statsRow"></div>

    <div class="two-col">
      <div class="panel">
        <h3>Status</h3>
        <div class="chart-box"><canvas id="statusChart"></canvas></div>
      </div>
      <div class="panel">
        <h3>Execution Unit</h3>
        <div class="chart-box"><canvas id="execChart"></canvas></div>
      </div>
    </div>

    <div class="two-col">
      <div class="panel">
        <h3>Team split</h3>
        <div class="chart-box"><canvas id="teamChart"></canvas></div>
      </div>
      <div class="panel">
        <h3>Top buyers by order count</h3>
        <div class="chart-box"><canvas id="buyerChart"></canvas></div>
      </div>
    </div>

    <div class="two-col">
      <div class="panel">
        <h3>Fabric flow by month</h3>
        <div class="chart-box"><canvas id="fabricChart"></canvas></div>
      </div>
      <div class="panel">
        <h3>Sewing hours by month</h3>
        <div class="chart-box"><canvas id="sewChart"></canvas></div>
      </div>
    </div>

    <div class="panel">
      <h3>Orders</h3>
      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="Search EWO #, buyer, status..." />
        <select id="statusFilter"><option value="">All statuses</option></select>
        <select id="buyerFilter"><option value="">All buyers</option></select>
      </div>
      <div class="table-wrap"><table id="dataTable"></table></div>
    </div>
  </div>
</main>

<script>
/* ============================================================
   NOTHING HERE NEEDS EDITING FOR THE NORMAL SETUP

   The page reads data.json, which sits next to this file in the
   repository. A GitHub Action rebuilds that file from the OneDrive
   workbook on a schedule and commits it, so visitors always get
   current numbers without signing in or choosing anything.

   The workbook itself cannot be read by this page directly. OneDrive
   sends no cross-origin headers, and its old anonymous API now
   answers "unauthenticated". That is why the download happens in the
   Action instead, where those rules do not apply.

   Setup steps are in README.md. FLOW_URL below is an alternative for
   anyone who would rather use Power Automate than the Action.
   ============================================================ */
var DATA_URL = "data.json";
var AUTO_REFRESH_MINUTES = 10;   // re-check data.json on a timer. 0 turns it off.

var FLOW_URL = "";               // optional Power Automate endpoint, tried before data.json
var FLOW_METHOD = "POST";
var SHEET_MAIN = "EWO";
var SHEET_FABRIC = "Fsum";
var SHEET_SEW = "Ssum";
/* ============================================================ */

var charts = {};
var allRows = [];
var lastLoader = null;
var refreshTimer = null;

var els = {};
["refreshBtn","statusDot","statusText","fileLabel","loadingState","dashboard",
 "statsRow","dataTable","errorBox","searchInput","statusFilter","buyerFilter"
].forEach(function(id){ els[id] = document.getElementById(id); });

function esc(v){
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function showError(html){ els.errorBox.innerHTML = '<div class="error">' + html + '</div>'; }
function clearError(){ els.errorBox.innerHTML = ""; }
function setStatus(text, cls){
  els.statusText.textContent = text;
  els.statusDot.className = "dot" + (cls ? " " + cls : "");
}

/* ============================================================
   Reading the flow response

   "List rows present in a table" returns an array of objects. This
   flattens any such array into the rows-of-arrays shape the rest of
   the page expects, using the first object's keys as the header row
   and dropping the connector's own bookkeeping columns.
   ============================================================ */
function toMatrix(input){
  if(!Array.isArray(input) || input.length === 0) return [];
  if(Array.isArray(input[0])) return input;
  var keys = Object.keys(input[0]).filter(function(k){
    return k.charAt(0) !== "@" && k !== "ItemInternalId";
  });
  return [keys].concat(input.map(function(o){
    return keys.map(function(k){ return o[k]; });
  }));
}

function normaliseBundle(raw){
  if(Array.isArray(raw)) return { EWO: toMatrix(raw), Fsum: [], Ssum: [] };
  if(raw && Array.isArray(raw.value)) return { EWO: toMatrix(raw.value), Fsum: [], Ssum: [] };
  function pick(name){
    var key = Object.keys(raw || {}).find(function(k){ return k.toLowerCase() === name.toLowerCase(); });
    if(!key) return [];
    var v = raw[key];
    if(v && !Array.isArray(v) && Array.isArray(v.value)) v = v.value;
    return toMatrix(v);
  }
  return { EWO: pick(SHEET_MAIN), Fsum: pick(SHEET_FABRIC), Ssum: pick(SHEET_SEW) };
}

/* The commonest setup mistake is pasting the workbook's own OneDrive address
   here. That address is used inside the flow, not by this page, and a browser
   is not allowed to call SharePoint from another site. Catch it by name so the
   message says so, rather than reporting a bare network failure. */
function looksLikeFileLink(url){
  return /sharepoint\.com|onedrive\.live\.com|1drv\.ms/i.test(url);
}

async function loadFromFlow(){
  if(looksLikeFileLink(FLOW_URL)){
    throw new Error("FLOW_URL currently holds the workbook's own OneDrive address. That is not "
      + "what goes here. The workbook address is used inside the flow, on the Excel action. "
      + "FLOW_URL must be the address Power Automate shows on the trigger \"When an HTTP request "
      + "is received\". It contains logic.azure.com and ends with a long sig= value. "
      + "See Step 2 in README.md.");
  }

  var res;
  try{
    res = await fetch(FLOW_URL, {
      method: FLOW_METHOD,
      headers: { "Accept": "application/json" }
    });
  }catch(e){
    throw new Error("The browser could not reach the flow. Check that FLOW_URL was pasted "
      + "in full, including everything after the question mark.");
  }

  if(res.status === 401 || res.status === 403){
    throw new Error("The flow rejected the request (" + res.status + "). The signature in "
      + "FLOW_URL is wrong or incomplete. Copy the whole URL from the trigger again.");
  }
  if(res.status === 405){
    throw new Error("The flow refused this HTTP method. Either set FLOW_METHOD to \"GET\" "
      + "and set the trigger's Method to GET, or leave both at POST.");
  }
  if(res.status === 202){
    throw new Error("The flow accepted the call but returned no data, which means it has no "
      + "Response action. Add one and set its body to the rows.");
  }
  if(!res.ok){
    var body = "";
    try{ body = (await res.text()).slice(0, 200); }catch(e){}
    throw new Error("The flow answered " + res.status + " " + esc(res.statusText) + ". " + esc(body));
  }

  var payload;
  try{
    payload = await res.json();
  }catch(e){
    throw new Error("The flow did not return JSON. Check that the Response action's body is "
      + "set to the rows and that its Content-Type is application/json.");
  }
  return normaliseBundle(payload);
}

async function loadFromJson(){
  var res = await fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" });
  if(!res.ok) throw new Error(res.status + " " + res.statusText);
  return normaliseBundle(await res.json());
}

/* ============================================================
   Orchestration
   ============================================================ */
async function run(loader, label, opts){
  opts = opts || {};
  if(!opts.quiet){ clearError(); setStatus("Loading...", "busy"); }
  els.refreshBtn.disabled = true;
  try{
    var bundle = await loader();
    if(!bundle.EWO || bundle.EWO.length === 0){
      throw new Error("The flow returned no rows. Check that the Excel action points at the "
        + "right table, and that pagination is switched on so it returns more than 256 rows.");
    }
    render(bundle);
    lastLoader = loader;
    els.fileLabel.textContent = label;
    els.loadingState.style.display = "none";
    els.dashboard.style.display = "block";
    clearError();
    setStatus("Updated " + new Date().toLocaleTimeString(), "live");
    els.refreshBtn.disabled = false;
    startAutoRefresh();
    return true;
  }catch(e){
    if(opts.quiet){
      // A failed background refresh must not wipe data that is already on screen.
      setStatus("Refresh failed, showing older data", "err");
      els.refreshBtn.disabled = false;
    }else{
      els.loadingState.style.display = "none";
      els.dashboard.style.display = "none";
      showError("<strong>Couldn't load the data.</strong><br/>" + esc(e.message));
      setStatus("Not loaded", "err");
      els.refreshBtn.disabled = !lastLoader;
    }
    return false;
  }
}

function startAutoRefresh(){
  if(refreshTimer) clearInterval(refreshTimer);
  if(!AUTO_REFRESH_MINUTES || !lastLoader) return;
  refreshTimer = setInterval(function(){
    run(lastLoader, els.fileLabel.textContent, { quiet: true });
  }, AUTO_REFRESH_MINUTES * 60000);
}

function render(bundle){
  parseEwoSheet(bundle.EWO);
  renderMonthly(bundle.Fsum, "fabricChart", "Fabric qty");
  renderMonthly(bundle.Ssum, "sewChart", "Sewing hours");
}

/* ============================================================
   Parsing
   ============================================================ */
function findHeaderRow(rows, mustContain){
  for(var i = 0; i < Math.min(rows.length, 10); i++){
    var rowVals = (rows[i] || []).map(function(v){
      return (v == null ? "" : String(v)).trim().toLowerCase();
    });
    var ok = mustContain.every(function(m){ return rowVals.indexOf(m) !== -1; });
    if(ok) return i;
  }
  return -1;
}

function toNum(v){
  var n = typeof v === "number" ? v : parseFloat(v);
  return isNaN(n) ? 0 : n;
}

/* Every branch ends at a UTC midnight and prints in UTC, so the calendar day
   never shifts with the reader's time zone. The Excel connector may hand back
   a date as a number, as a numeric string, or as ISO text, so all three are
   handled here. */
function fmtParts(d){
  return d.toLocaleDateString(undefined, { timeZone: "UTC" });
}
function serialToDate(n){
  return new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 86400000);
}
function fmtDate(v){
  if(v == null || v === "") return "";

  if(typeof v === "number" && v > 20000 && v < 60000) return fmtParts(serialToDate(v));

  var s = String(v).trim();

  // Some cells hold a bare time such as "00:00:00" where a date was meant.
  // That is not a date, so show nothing rather than a meaningless clock value.
  if(/^\d{1,2}:\d{2}(:\d{2})?$/.test(s)) return "";

  if(/^\d+(\.\d+)?$/.test(s)){
    var n = parseFloat(s);
    if(n > 20000 && n < 60000) return fmtParts(serialToDate(n));
  }

  var iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(iso) return fmtParts(new Date(Date.UTC(+iso[1], +iso[2] - 1, +iso[3])));

  if(v instanceof Date){
    if(isNaN(v.getTime())) return "";
    var wall = v.getTime() - v.getTimezoneOffset() * 60000;
    return fmtParts(new Date(Math.round(wall / 86400000) * 86400000));
  }

  var d = new Date(s);
  if(isNaN(d.getTime())) return s;
  return fmtParts(new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())));
}

function parseEwoSheet(rows){
  var headerRowIdx = findHeaderRow(rows, ["status", "buyer"]);
  if(headerRowIdx === -1){
    throw new Error('No header row containing both "Status" and "Buyer" was found. Check that '
      + 'the Excel table in the flow is the EWO table and that its header row is intact.');
  }

  var headers = rows[headerRowIdx];
  var headerMap = {};
  headers.forEach(function(h, i){ if(h) headerMap[String(h).trim().toLowerCase()] = i; });
  function col(name){ return headerMap[name.toLowerCase()]; }

  var idIdx = col("EWO");
  if(idIdx == null) throw new Error('A header row was found, but it has no "EWO" column.');

  var dataRows = rows.slice(headerRowIdx + 1).filter(function(r){
    return r && r[idIdx] != null && r[idIdx] !== "";
  });

  allRows = dataRows.map(function(r){
    return {
      ewo: r[col("EWO")],
      status: r[col("Status")] == null ? "Unknown" : r[col("Status")],
      note: col("Latest note") != null ? r[col("Latest note")] : "",
      team: col("Team") != null && r[col("Team")] != null ? r[col("Team")] : "Unknown",
      buyer: col("Buyer") != null && r[col("Buyer")] != null ? r[col("Buyer")] : "Unknown",
      dept: col("Dept") != null ? r[col("Dept")] : "",
      execUnit: col("Execution Unit") != null && r[col("Execution Unit")] != null ? r[col("Execution Unit")] : "Unknown",
      orderQty: toNum(r[col("Order Qty")]),
      fabQty: toNum(r[col("Fab Qty")]),
      orderBankDate: col("Order Bank Date") != null ? r[col("Order Bank Date")] : null
    };
  });

  renderStats();
  renderBreakdown("status", "statusChart", "Status");
  renderBreakdown("execUnit", "execChart", "Execution Unit");
  renderBreakdown("team", "teamChart", "Team");
  renderTopBuyers();
  renderTable(allRows);
  populateFilters();
}

/* ============================================================
   Rendering
   ============================================================ */
function renderStats(){
  els.statsRow.innerHTML = "";
  var totalOrderQty = allRows.reduce(function(s, r){ return s + r.orderQty; }, 0);
  var totalFabQty = allRows.reduce(function(s, r){ return s + r.fabQty; }, 0);
  var distinctBuyers = new Set(allRows.map(function(r){ return r.buyer; })).size;
  var locked = allRows.filter(function(r){
    return String(r.status).toLowerCase().indexOf("locked") === 0;
  }).length;

  addStat("Total EWOs", allRows.length.toLocaleString());
  addStat("Locked", locked.toLocaleString());
  addStat("Total Order Qty", Math.round(totalOrderQty).toLocaleString());
  addStat("Total Fab Qty", Math.round(totalFabQty).toLocaleString());
  addStat("Buyers", distinctBuyers);
}

function addStat(label, value){
  var div = document.createElement("div");
  div.className = "stat";
  div.innerHTML = '<div class="label">' + esc(label) + '</div><div class="value">' + esc(value) + '</div>';
  els.statsRow.appendChild(div);
}

function countBy(field){
  var map = {};
  allRows.forEach(function(r){
    var key = String(r[field] == null ? "Unknown" : r[field]).trim() || "Unknown";
    map[key] = (map[key] || 0) + 1;
  });
  return Object.keys(map).map(function(k){ return [k, map[k]]; })
    .sort(function(a, b){ return b[1] - a[1]; });
}

function destroyChart(id){
  if(charts[id]){ charts[id].destroy(); delete charts[id]; }
}

var MONO = { family: "IBM Plex Mono", size: 11 };

function renderBreakdown(field, canvasId, label){
  var entries = countBy(field);
  var palette = ["#2B6E5E", "#C7511F", "#B98900", "#6B7280", "#8FA6D6", "#A85CC1", "#4E9E7E", "#D98E3B"];
  destroyChart(canvasId);
  charts[canvasId] = new Chart(document.getElementById(canvasId), {
    type: "bar",
    data: {
      labels: entries.map(function(e){ return e[0]; }),
      datasets: [{
        label: label,
        data: entries.map(function(e){ return e[1]; }),
        backgroundColor: entries.map(function(_, i){ return palette[i % palette.length]; })
      }]
    },
    options: {
      indexAxis: "y", responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { ticks: { font: MONO } }, y: { ticks: { font: MONO } } }
    }
  });
}

function renderTopBuyers(){
  var entries = countBy("buyer").slice(0, 12);
  destroyChart("buyerChart");
  charts.buyerChart = new Chart(document.getElementById("buyerChart"), {
    type: "bar",
    data: {
      labels: entries.map(function(e){ return e[0]; }),
      datasets: [{ label: "Orders", data: entries.map(function(e){ return e[1]; }), backgroundColor: "#2B6E5E" }]
    },
    options: {
      indexAxis: "y", responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { ticks: { font: MONO } }, y: { ticks: { font: { family: "IBM Plex Mono", size: 10 } } } }
    }
  });
}

function renderMonthly(rows, canvasId, label){
  destroyChart(canvasId);
  if(!rows || rows.length === 0) return;
  var monthRe = /^[A-Za-z]+\s?\d{2}$/;
  var seen = new Map();
  rows.forEach(function(r){
    if(!r) return;
    var m = r[0], v = r[1];
    if(typeof v === "string" && /^-?\d+(\.\d+)?$/.test(v.trim())) v = parseFloat(v);
    if(typeof m === "string" && monthRe.test(m.trim()) && typeof v === "number" && !seen.has(m.trim())){
      seen.set(m.trim(), v);
    }
  });
  if(seen.size === 0) return;
  charts[canvasId] = new Chart(document.getElementById(canvasId), {
    type: "line",
    data: {
      labels: Array.from(seen.keys()),
      datasets: [{
        label: label,
        data: Array.from(seen.values()),
        borderColor: "#2B6E5E", backgroundColor: "#E7EFEC",
        fill: true, tension: 0.25, pointRadius: 3
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { ticks: { font: MONO } }, y: { ticks: { font: MONO } } }
    }
  });
}

function statusBadge(status){
  var s = String(status).toLowerCase();
  var cls = "";
  if(s.indexOf("locked") === 0) cls = "locked";
  else if(s.indexOf("hold") !== -1 || s.indexOf("block") !== -1) cls = "hold";
  else if(s.indexOf("tbc") !== -1 || s.indexOf("later") !== -1 || s.indexOf("pending") !== -1) cls = "tbc";
  else if(s.indexOf("cancel") !== -1) cls = "cancel";
  return '<span class="badge ' + cls + '">' + esc(status) + '</span>';
}

function renderTable(rows){
  var table = els.dataTable;
  table.innerHTML = "";
  var thead = document.createElement("thead");
  thead.innerHTML = "<tr><th>EWO</th><th>Status</th><th>Buyer</th><th>Team</th><th>Execution Unit</th>"
    + "<th>Order Qty</th><th>Fab Qty</th><th>Order Bank Date</th><th>Note</th></tr>";
  table.appendChild(thead);
  var tbody = document.createElement("tbody");
  rows.slice(0, 300).forEach(function(r){
    var tr = document.createElement("tr");
    tr.innerHTML = "<td>" + esc(r.ewo) + "</td>"
      + "<td>" + statusBadge(r.status) + "</td>"
      + "<td>" + esc(r.buyer) + "</td>"
      + "<td>" + esc(r.team) + "</td>"
      + "<td>" + esc(r.execUnit) + "</td>"
      + "<td>" + esc(Math.round(r.orderQty).toLocaleString()) + "</td>"
      + "<td>" + esc(Math.round(r.fabQty).toLocaleString()) + "</td>"
      + "<td>" + esc(fmtDate(r.orderBankDate)) + "</td>"
      + "<td>" + esc(r.note) + "</td>";
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
}

function populateFilters(){
  var statuses = Array.from(new Set(allRows.map(function(r){ return String(r.status); }))).sort();
  var buyers = Array.from(new Set(allRows.map(function(r){ return String(r.buyer); }))).sort();
  function opts(list){
    return list.map(function(v){ return '<option value="' + esc(v) + '">' + esc(v) + '</option>'; }).join("");
  }
  els.statusFilter.innerHTML = '<option value="">All statuses</option>' + opts(statuses);
  els.buyerFilter.innerHTML = '<option value="">All buyers</option>' + opts(buyers);
}

function applyFilters(){
  var q = els.searchInput.value.trim().toLowerCase();
  var statusF = els.statusFilter.value;
  var buyerF = els.buyerFilter.value;
  var filtered = allRows.filter(function(r){
    if(statusF && String(r.status) !== statusF) return false;
    if(buyerF && String(r.buyer) !== buyerF) return false;
    if(q){
      var hay = (r.ewo + " " + r.status + " " + r.buyer + " " + r.team + " " + r.execUnit + " " + r.note).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  });
  renderTable(filtered);
}

els.searchInput.addEventListener("input", applyFilters);
els.statusFilter.addEventListener("change", applyFilters);
els.buyerFilter.addEventListener("change", applyFilters);
els.refreshBtn.addEventListener("click", function(){
  if(lastLoader) run(lastLoader, els.fileLabel.textContent);
});

/* ============================================================
   Startup
   ============================================================ */
(async function(){
  if(FLOW_URL){
    els.fileLabel.textContent = "Live via Power Automate";
    await run(loadFromFlow, "Live via Power Automate");
    return;
  }

  try{
    var bundle = await loadFromJson();
    await run(function(){ return Promise.resolve(bundle); }, "OneDrive workbook");
    return;
  }catch(e){
    els.loadingState.style.display = "none";
    els.fileLabel.textContent = "No data published yet";
    setStatus("No data yet", "err");
    showError("<strong>The data file has not been published yet.</strong><br/><br/>"
      + "This page reads <code>data.json</code>, which the GitHub Action builds from your "
      + "OneDrive workbook. Open the <strong>Actions</strong> tab in the repository and run "
      + "<strong>Refresh EWO data</strong> once. After it finishes, reload this page.<br/><br/>"
      + "If the run failed, the usual cause is a missing <code>ONEDRIVE_SHARE_URL</code> secret. "
      + "Step 2 in README.md covers it.");
  }
})();
</script>
</body>
